<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Members | FitZone Admin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

    <!-- Admin Navigation -->
    <nav class="navbar-custom">
        <div class="container-custom navbar-content">

            <a href="admin-dashboard.html" class="logo">
                FitZone<span>.</span> Admin
            </a>

            <div class="nav-links">
                <a href="admin-dashboard.html">Dashboard</a>
                <a href="admin-members.html">Members</a>
                <a href="admin-plans.html">Plans</a>

                <button type="button" class="btn-custom" id="logoutBtn">
                    Logout
                </button>
            </div>

        </div>
    </nav>


    <!-- Members Management -->
    <main class="container-custom section">

        <section class="dashboard-heading">
            <p class="text-muted">ADMINISTRATION</p>
            <h1>Manage <span>Members</span></h1>
            <p class="text-muted">
                Search and manage registered gym members.
            </p>
        </section>


        <section class="content-card">

            <!-- Search and Filter -->
            <div class="admin-toolbar">

                <div class="form-group">
                    <label for="memberSearch">Search Members</label>
                    <input
                        type="search"
                        id="memberSearch"
                        placeholder="Search by name or email..."
                    >
                </div>

                <div class="form-group">
                    <label for="memberFilter">Membership Status</label>
                    <select id="memberFilter">
                        <option value="all">All Members</option>
                        <option value="active">Active</option>
                        <option value="expired">Expired</option>
                        <option value="none">No Plan</option>
                    </select>
                </div>

            </div>


            <!-- Members Table -->
            <div class="table-responsive">

                <table class="table-custom">

                    <thead>
                        <tr>
                            <th>Member ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Plan</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="membersTableBody">
                        <tr>
                            <td colspan="7">Loading members...</td>
                        </tr>
                    </tbody>

                </table>

            </div>

            <p id="membersMessage" class="form-message" aria-live="polite"></p>

        </section>

    </main>


    <footer class="footer">
        <div class="container-custom">
            <p>&copy; 2026 FitZone Gym. All rights reserved.</p>
        </div>
    </footer>


    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>

</body>
</html>
