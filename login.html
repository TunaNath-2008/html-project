

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login / Register | ACTIVE NATION</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Shared CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Role Selection */

        .role-selection {
            margin-bottom: 25px;
        }

        .role-selection > label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text-color, #ffffff);
        }

        .role-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .role-option {
            border: 1px solid #374151;
            background: #111827;
            color: #d1d5db;
            padding: 16px 10px;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s ease;
            margin: 0;
        }

        .role-option input {
            display: none;
        }

        .role-option strong {
            display: block;
            font-size: 15px;
            margin-bottom: 5px;
        }

        .role-option span {
            font-size: 12px;
            color: #9ca3af;
        }

        .role-option.active {
            border-color: #2f80ff;
            background: rgba(47, 128, 255, 0.12);
            color: #ffffff;
        }

        .role-option:hover {
            border-color: #2f80ff;
        }

        .role-icon {
            font-size: 23px;
            display: block;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar-custom">

        <a href="index.html" class="logo">
            ACTIVE<span> NATION</span>
        </a>

        <a href="index.html" class="btn-outline">
            Back to Home
        </a>

    </nav>


    <!-- Login and Registration -->
    <main class="auth-container">

        <div class="auth-card">

            <div class="text-center mb-4">

                <a href="index.html" class="logo">
                    ACTIVE<span> NATION</span>
                </a>

                <p class="auth-subtitle mt-3 mb-0">
                    Your fitness journey starts here.
                </p>

            </div>


            <!-- Tabs -->
            <div class="auth-tabs">

                <button
                    type="button"
                    class="auth-tab active"
                    id="loginTab"
                >
                    Login
                </button>

                <button
                    type="button"
                    class="auth-tab"
                    id="registerTab"
                >
                    Register
                </button>

            </div>


            <!-- Feedback Message -->
            <div
                id="authMessage"
                class="auth-message"
                role="status"
                aria-live="polite"
            ></div>


            <!-- LOGIN FORM -->
            <form id="loginForm" class="auth-form">

                <!-- Login Role Selection -->
                <div class="role-selection">

                    <label>Login As</label>

                    <div class="role-options">

                        <label class="role-option active" id="memberOption">

                            <input
                                type="radio"
                                name="loginRole"
                                value="member"
                                checked
                            >

                            <span class="role-icon">👤</span>

                            <strong>Member</strong>

                            <span>Member Dashboard</span>

                        </label>


                        <label class="role-option" id="trainerOption">

                            <input
                                type="radio"
                                name="loginRole"
                                value="trainer"
                            >

                            <span class="role-icon">🏋️</span>

                            <strong>Trainer</strong>

                            <span>Trainer Dashboard</span>

                        </label>

                    </div>

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        class="form-control"
                        placeholder="Enter your email"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button type="submit" class="btn-custom">
                    Login
                </button>

            </form>


            <!-- REGISTRATION FORM -->
            <form id="registerForm" class="auth-form" hidden>

                <!-- Full Name -->
                <div class="form-group">

                    <label for="registerName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        class="form-control"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        minlength="2"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="registerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        class="form-control"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Phone -->
                <div class="form-group">

                    <label for="registerPhone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="registerPhone"
                        class="form-control"
                        placeholder="Enter your phone number"
                        autocomplete="tel"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        title="Enter a 10-digit phone number"
                        required
                    >

                </div>


                <!-- Registration Role Selection -->
                <div class="role-selection">

                    <label>Register As</label>

                    <div class="role-options">

                        <label
                            class="role-option active"
                            id="registerMemberOption"
                        >

                            <input
                                type="radio"
                                name="registerRole"
                                value="member"
                                checked
                            >

                            <span class="role-icon">👤</span>

                            <strong>Member</strong>

                            <span>Member Account</span>

                        </label>


                        <label
                            class="role-option"
                            id="registerTrainerOption"
                        >

                            <input
                                type="radio"
                                name="registerRole"
                                value="trainer"
                            >

                            <span class="role-icon">🏋️</span>

                            <strong>Trainer</strong>

                            <span>Trainer Account</span>

                        </label>

                    </div>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="registerPassword">
                        Create Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        class="form-control"
                        placeholder="At least 8 characters"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-control"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                </div>


                <button type="submit" class="btn-custom">
                    Create Account
                </button>

            </form>


            <p
                class="text-center mt-4 mb-0"
                style="color: var(--text-muted); font-size: 13px;"
            >
                By continuing, you agree to use ACTIVE NATION
                responsibly.
            </p>

        </div>

    </main>


    <!-- Shared Storage -->
    <script src="js/storage.js"></script>


    <!-- Login and Registration Logic -->
    <script>

        // =====================================
        // 1. GET PAGE ELEMENTS
        // =====================================

        const loginTab = document.getElementById("loginTab");
        const registerTab = document.getElementById("registerTab");

        const loginForm = document.getElementById("loginForm");
        const registerForm = document.getElementById("registerForm");

        const authMessage = document.getElementById("authMessage");

        const memberOption = document.getElementById("memberOption");
        const trainerOption = document.getElementById("trainerOption");

        const registerMemberOption = document.getElementById(
            "registerMemberOption"
        );

        const registerTrainerOption = document.getElementById(
            "registerTrainerOption"
        );


        // =====================================
        // 2. DISPLAY MESSAGE
        // =====================================

        function showMessage(message, type) {

            authMessage.textContent = message;

            authMessage.className =
                "auth-message message-" + type;

        }


        // =====================================
        // 3. LOGIN ROLE SELECTION
        // =====================================

        function updateRoleSelection() {

            const selectedRole = document.querySelector(
                'input[name="loginRole"]:checked'
            ).value;

            memberOption.classList.toggle(
                "active",
                selectedRole === "member"
            );

            trainerOption.classList.toggle(
                "active",
                selectedRole === "trainer"
            );

        }


        document.querySelectorAll(
            'input[name="loginRole"]'
        ).forEach(input => {

            input.addEventListener(
                "change",
                updateRoleSelection
            );

        });


        // =====================================
        // 4. REGISTRATION ROLE SELECTION
        // =====================================

        function updateRegisterRoleSelection() {

            const selectedRole = document.querySelector(
                'input[name="registerRole"]:checked'
            ).value;

            registerMemberOption.classList.toggle(
                "active",
                selectedRole === "member"
            );

            registerTrainerOption.classList.toggle(
                "active",
                selectedRole === "trainer"
            );

        }


        document.querySelectorAll(
            'input[name="registerRole"]'
        ).forEach(input => {

            input.addEventListener(
                "change",
                updateRegisterRoleSelection
            );

        });


        // =====================================
        // 5. SWITCH LOGIN / REGISTER TABS
        // =====================================

        function showTab(tab) {

            const showLogin = tab === "login";

            loginForm.hidden = !showLogin;
            registerForm.hidden = showLogin;

            loginTab.classList.toggle("active", showLogin);
            registerTab.classList.toggle("active", !showLogin);

            authMessage.textContent = "";
            authMessage.className = "auth-message";

        }


        loginTab.addEventListener("click", function () {

            showTab("login");

        });


        registerTab.addEventListener("click", function () {

            showTab("register");

        });


        // =====================================
        // 6. REGISTER MEMBER OR TRAINER
        // =====================================

        registerForm.addEventListener("submit", function (event) {

            event.preventDefault();


            const name = document
                .getElementById("registerName")
                .value.trim();

            const email = document
                .getElementById("registerEmail")
                .value.trim()
                .toLowerCase();

            const phone = document
                .getElementById("registerPhone")
                .value.trim();

            const password = document
                .getElementById("registerPassword")
                .value;

            const confirmPassword = document
                .getElementById("confirmPassword")
                .value;


            // Get selected registration role

            const selectedRole = document.querySelector(
                'input[name="registerRole"]:checked'
            ).value;


            // Check password length

            if (password.length < 8) {

                showMessage(
                    "Password must contain at least 8 characters.",
                    "error"
                );

                return;

            }


            // Check whether passwords match

            if (password !== confirmPassword) {

                showMessage(
                    "Passwords do not match.",
                    "error"
                );

                return;

            }


            // Validate phone number

            if (!/^[0-9]{10}$/.test(phone)) {

                showMessage(
                    "Please enter a valid 10-digit phone number.",
                    "error"
                );

                return;

            }


            // Retrieve existing accounts

            const members = getMembers();


            // Prevent duplicate email registration

            const existingMember = members.find(function (member) {

                return (
                    member.email &&
                    member.email.toLowerCase() === email
                );

            });


            if (existingMember) {

                showMessage(
                    "An account with this email already exists.",
                    "error"
                );

                return;

            }


            // Create new account

            const newMember = {

                id: generateId(
                    selectedRole === "trainer" ? "TRN" : "MEM"
                ),

                name: name,

                email: email,

                phone: phone,

                password: password,

                role: selectedRole,

                planId: null,

                startDate: null,

                endDate: null

            };


            // Save account

            members.push(newMember);

            saveMembers(members);


            // Reset registration form

            registerForm.reset();

            updateRegisterRoleSelection();


            // Switch to login tab

            showTab("login");


            // Automatically fill registered email

            document.getElementById("loginEmail").value = email;


            // Automatically select matching login role

            document.querySelector(
                `input[name="loginRole"][value="${selectedRole}"]`
            ).checked = true;

            updateRoleSelection();


            // Show success message

            showMessage(
                selectedRole === "trainer"
                    ? "Trainer registration successful! Please log in."
                    : "Member registration successful! Please log in.",
                "success"
            );

        });


        // =====================================
        // 7. LOGIN MEMBER OR TRAINER
        // =====================================

        loginForm.addEventListener("submit", function (event) {

            event.preventDefault();


            const email = document
                .getElementById("loginEmail")
                .value.trim()
                .toLowerCase();

            const password = document
                .getElementById("loginPassword")
                .value;


            const selectedRole = document.querySelector(
                'input[name="loginRole"]:checked'
            ).value;


            // Validate empty fields

            if (!email || !password) {

                showMessage(
                    "Please enter your email and password.",
                    "error"
                );

                return;

            }


            // Retrieve registered accounts

            const members = getMembers();


            // Find matching account

            const user = members.find(function (member) {

                return (
                    member.email &&
                    member.email.toLowerCase() === email &&
                    member.password === password
                );

            });


            // Reject invalid credentials

            if (!user) {

                showMessage(
                    "Invalid email or password. Please try again.",
                    "error"
                );

                return;

            }


            // MEMBER LOGIN

            if (selectedRole === "member") {

                if (user.role !== "member") {

                    showMessage(
                        "This account is not registered as a member.",
                        "error"
                    );

                    return;

                }


                setCurrentUser({

                    id: user.id,

                    role: "member"

                });


                window.location.href = "dashboard.html";

                return;

            }


            // TRAINER LOGIN

            if (selectedRole === "trainer") {

                if (user.role !== "trainer" && user.role !== "admin") {

                    showMessage(
                        "This account does not have trainer dashboard access.",
                        "error"
                    );

                    return;

                }


                setCurrentUser({

                    id: user.id,

                    role: user.role

                });


                window.location.href = "admin-dashboard.html";

                return;

            }

        });


        // =====================================
        // 8. INITIAL PAGE STATE
        // =====================================

        showTab("login");

        updateRoleSelection();

        updateRegisterRoleSelection();

    </script>

</body>

</html>
