<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Plans | FitLife Admin</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="admin-header">
    <div class="container admin-header-inner">
      <a href="admin-dashboard.html" class="logo">FitLife <span>Admin</span></a>

      <nav class="admin-nav">
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-members.html">Members</a>
        <a href="admin-plans.html" class="active">Plans</a>
      </nav>

      <button id="logoutBtn" class="btn btn-outline" type="button">Logout</button>
    </div>
  </header>

  <main class="container admin-page">
    <section class="page-heading">
      <div>
        <p class="eyebrow">ADMINISTRATION</p>
        <h1>Membership Plans</h1>
        <p>Create, edit, and manage the plans offered to members.</p>
      </div>

      <button id="addPlanBtn" class="btn btn-primary" type="button">
        + Add Plan
      </button>
    </section>

    <div id="planMessage" class="message" role="status" aria-live="polite"></div>

    <section class="admin-card">
      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Plan</th>
              <th>Duration</th>
              <th>Price</th>
              <th>Description</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="plansTableBody">
            <tr>
              <td colspan="5">Loading plans...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Add/Edit Plan Modal -->
  <div id="planModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>

    <section class="modal-content" role="dialog" aria-modal="true"
             aria-labelledby="planModalTitle">
      <div class="modal-header">
        <h2 id="planModalTitle">Add Membership Plan</h2>
        <button id="closePlanModalBtn" class="modal-close" type="button"
                aria-label="Close modal">&times;</button>
      </div>

      <form id="planForm">
        <div class="form-group">
          <label for="planName">Plan Name</label>
          <input id="planName" name="planName" type="text"
                 placeholder="e.g. Premium" required>
        </div>

        <div class="form-group">
          <label for="planDuration">Duration</label>
          <select id="planDuration" name="planDuration" required>
            <option value="">Select duration</option>
            <option value="1 month">1 Month</option>
            <option value="3 months">3 Months</option>
            <option value="6 months">6 Months</option>
            <option value="12 months">12 Months</option>
          </select>
        </div>

        <div class="form-group">
          <label for="planPrice">Price (₹)</label>
          <input id="planPrice" name="planPrice" type="number"
                 min="0" step="1" placeholder="e.g. 1500" required>
        </div>

        <div class="form-group">
          <label for="planDescription">Description</label>
          <textarea id="planDescription" name="planDescription"
                    rows="3" placeholder="What's included in this plan?"
                    required></textarea>
        </div>

        <div class="modal-actions">
          <button id="cancelPlanBtn" class="btn btn-outline" type="button">
            Cancel
          </button>
          <button class="btn btn-primary" type="submit">Save Plan</button>
        </div>
      </form>
    </section>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
